[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rag"
version = "0.1.0"
description = "Learning-focused RAG application."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "python-dotenv",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-ollama",
    "langchain-qdrant",
    "langchain-text-splitters",
    "rank-bm25",
    "qdrant-client",
    "markdown",
    "pypdf",
    # 0.19 起 unstructured 依赖 spaCy，并在首次解析时联网下载安装 en_core_web_sm，
    # 会破坏镜像的可复现性，暂时锁在 0.18.x
    "unstructured<0.19",
    "redis>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
