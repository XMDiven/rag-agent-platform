x-backend-environment: &backend-environment
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_documents}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-7}
  RETRIEVAL_SEARCH_TYPE: ${RETRIEVAL_SEARCH_TYPE:-similarity}
  RETRIEVAL_FETCH_K: ${RETRIEVAL_FETCH_K:-50}
  RETRIEVAL_LAMBDA_MULT: ${RETRIEVAL_LAMBDA_MULT:-0.3}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.moonshot.cn/v1}
  LLM_MODEL_ID: ${LLM_MODEL_ID:-kimi-k2.6}
  LLM_THINKING_TYPE: ${LLM_THINKING_TYPE:-disabled}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  qdrant-init:
    image: rag-agent-platform-rag-api
    command: ["python", "-m", "rag_app.scripts.ensure_collection"]
    environment:
      <<: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  rag-api:
    image: rag-agent-platform-rag-api
    build:
      context: ./rag
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - rag_data:/app/data
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent-api:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      <<: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      AGENT_API_URL: http://agent-api:8002/agent/run
    ports:
      - "3000:3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  rag_data:
